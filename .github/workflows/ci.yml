name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAYLOAD_SECRET: ci-build-secret
      VDB_FORCE_STATIC_FALLBACK: "1"
      DATABASE_URL: postgresql://postgres:local-audit-only@127.0.0.1:5432/vd_beta_audit
      RESEND_API_KEY: ""
      CONTACT_TO_EMAIL: ""
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-audit-only
          POSTGRES_DB: vd_beta_audit
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:int
      - run: npm run payload migrate
      - run: npm run test:db
      - run: npm run test:db -- --rollback-check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright test --config playwright.cms.config.ts
