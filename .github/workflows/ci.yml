name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAYLOAD_SECRET: ci-build-secret
      VDB_FORCE_STATIC_FALLBACK: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:int
      - run: npm run build
